<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000839" />
  <title>El equipo te envió un regalo · Cajitas llenas de amor</title>
  <meta name="description" content="El equipo te envió un regalo. Toca la caja para descubrir los mensajes que te han dedicado." />

  <!-- Open Graph -->
  <meta property="og:title" content="El equipo te envió un regalo 🎁" />
  <meta property="og:description" content="Toca la caja y descubre los mensajes que tus compañeros tienen para ti." />
  <meta property="og:type" content="website" />

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
  />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E" />

  <link rel="stylesheet" href="./assets/styles.css" />
  <link rel="stylesheet" href="./assets/box.css" />
</head>
<body>
  <main class="scene" data-persona="carlos-corredor">
    <div class="shell shell--narrow scene--solo">
      <section class="hero-person">
        <p class="hero-person__greeting" data-persona-greeting>Para ti</p>
        <h1>El equipo te envió <em>un regalo</em></h1>
        <p class="hero-person__sub" data-persona-sub>Toca la caja para descubrir los mensajes que te han dedicado.</p>
      </section>

      <section class="box-stage" aria-label="Tu regalo">
        <span class="stage__glow" aria-hidden="true"></span>
        <span class="stage__floor" aria-hidden="true"></span>
        <span class="stage__shadow" aria-hidden="true"></span>
        <span class="stage__beam" aria-hidden="true"></span>

        <span class="sparkle sparkle--1" aria-hidden="true"></span>
        <span class="sparkle sparkle--2" aria-hidden="true"></span>
        <span class="sparkle sparkle--3" aria-hidden="true"></span>
        <span class="sparkle sparkle--4" aria-hidden="true"></span>
        <span class="sparkle sparkle--5" aria-hidden="true"></span>
        <span class="sparkle sparkle--6" aria-hidden="true"></span>

        <div data-gift role="button" tabindex="0" aria-label="Abrir el regalo"></div>

        <span class="gift-cta" aria-hidden="true">Toca para abrir</span>
      </section>

      <section class="messages" data-persona-messages hidden></section>

      <section class="empty" data-persona-empty hidden>
        <span class="empty__icon" aria-hidden="true">💌</span>
        <h2>Tu caja se está llenando de cariño</h2>
        <p>Pronto encontrarás aquí los mensajes que el equipo tiene para ti. Vuelve cuando recibas la notificación ✨</p>
      </section>
    </div>
  </main>

  <script src="./assets/data.js"></script>
  <script src="./assets/gift.js"></script>
  <script src="./assets/app.js"></script>
  <script src="./assets/confetti.js"></script>
  <script src="./assets/box.js"></script>
</body>
</html>
